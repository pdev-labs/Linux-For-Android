name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y shellcheck
      - name: Lint (warnings are errors)
        run: shellcheck -S warning install_linux.sh lib/*.sh tests/*.sh .github/scripts/android/*.sh

  syntax:
    name: bash -n
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse every script
        run: |
          bash -n install_linux.sh
          for f in lib/*.sh tests/*.sh .github/scripts/android/*.sh; do
            case "$f" in
              lib/real-feel.sh|lib/wallpaper.sh) sh -n "$f" ;;
              *) bash -n "$f" ;;
            esac
          done

      - name: Parse Python helpers
        run: |
          python3 -m py_compile tests/generate-android-matrix.py .github/scripts/android/vnc-probe.py

      - name: Validate the matrix generator
        run: |
          python3 tests/generate-android-matrix.py --mode smoke --format json \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["include"]; print(len(d["include"]), "smoke scenarios")'
          python3 tests/generate-android-matrix.py --mode reduced --format list | head -n 5
          python3 tests/generate-android-matrix.py --mode full --shard 0 --total-shards 8 --format json \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["include"] is not None; print(len(d["include"]), "full scenarios in shard 0")'

  tests:
    name: test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install prerequisites
        run: sudo apt-get update -qq && sudo apt-get install -y shellcheck coreutils
      - name: Run the suite
        run: |
          chmod +x tests/test-all.sh
          ./tests/test-all.sh
      - name: CLI surface
        run: |
          ./install_linux.sh --version
          ./install_linux.sh --help
