# Minimal Hyprland config for the nested spike.
# No hardware cursors (there is no DRM node), no blur or shadows (readback is
# expensive), stdout logs so the frame path is visible.

monitor=,preferred,auto,1

cursor {
    no_hardware_cursors = true
}

misc {
    disable_hyprland_logo = true
    force_default_wallpaper = 0
}

debug {
    disable_logs = false
    enable_stdout_logs = true
}

decoration {
    blur {
        enabled = false
    }
    shadow {
        enabled = false
    }
}
